<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jeffin Sam Joji Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --border: #1a1a1a;
      --text: #ebebeb;
      --muted: #5a5a5a;
      --accent: #10b981;
      --font-sans: 'Space Grotesk', sans-serif;
      --font-mono: 'Space Mono', monospace;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      overflow-x: hidden;
      cursor: none;
      -webkit-font-smoothing: antialiased;
    }

    /* Cursor spotlight */
    #cursor-glow {
      position: fixed;
      top: 0; left: 0;
      width: 500px; height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(16,185,129,0.07) 0%, transparent 65%);
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%);
      will-change: transform;
      transition: opacity 0.3s;
    }
    #cursor-dot {
      position: fixed;
      top: 0; left: 0;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent);
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      will-change: transform;
      box-shadow: 0 0 10px rgba(16,185,129,0.6);
    }
    #cursor-ring {
      position: fixed;
      top: 0; left: 0;
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 1px solid rgba(16,185,129,0.4);
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      will-change: transform;
      transition: transform 0.12s ease, width 0.2s ease, height 0.2s ease, opacity 0.2s;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: #222; border-radius: 2px; }

    /* Reveal animations */
    .reveal {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.75s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                  transform 0.75s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .reveal.visible { opacity: 1; transform: none; }
    .reveal-delay-1 { transition-delay: 0.1s; }
    .reveal-delay-2 { transition-delay: 0.2s; }
    .reveal-delay-3 { transition-delay: 0.35s; }

    a { color: inherit; text-decoration: none; display: block; }

    .mono { font-family: var(--font-mono); }
    .accent { color: var(--accent); }

    .tag {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 100px;
      border: 1px solid #222;
      font-size: 11px;
      color: #444;
      font-family: var(--font-mono);
      letter-spacing: 0.02em;
      transition: border-color 0.2s, color 0.2s;
    }
    .tag.accent-tag {
      border-color: rgba(16,185,129,0.25);
      color: var(--accent);
    }

    /* Tweaks panel */
    #tweaks-panel {
      display: none;
      position: fixed;
      bottom: 24px; right: 24px;
      background: #111;
      border: 1px solid #222;
      border-radius: 6px;
      padding: 20px 24px;
      z-index: 1000;
      width: 260px;
      font-family: var(--font-sans);
    }
    #tweaks-panel.active { display: block; }
    #tweaks-panel h4 { font-size: 12px; color: var(--accent); font-family: var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 16px; }
    #tweaks-panel label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 6px; margin-top: 14px; }
    #tweaks-panel select, #tweaks-panel input[type=range] { width: 100%; background: #1a1a1a; border: 1px solid #2a2a2a; color: var(--text); border-radius: 3px; padding: 6px 8px; font-size: 12px; font-family: var(--font-mono); cursor: pointer; }
    #tweaks-panel input[type=color] { width: 100%; height: 32px; background: none; border: 1px solid #2a2a2a; border-radius: 3px; cursor: pointer; padding: 2px; }
  </style>
</head>
<body>
  <div id="cursor-glow"></div>
  <div id="cursor-dot"></div>
  <div id="cursor-ring"></div>
  <div id="root"></div>

  <!-- Tweaks Panel (outside React) -->
  <div id="tweaks-panel">
    <h4>Tweaks</h4>
    <label>Accent Color</label>
    <input type="color" id="tw-accent" value="#10b981" />
    <label>Font Size Scale</label>
    <input type="range" id="tw-scale" min="85" max="115" value="100" />
    <label>Cursor Effect</label>
    <select id="tw-cursor">
      <option value="glow">Glow Spotlight</option>
      <option value="dot">Dot Only</option>
      <option value="off">Off</option>
    </select>
    <label>Section Spacing</label>
    <select id="tw-spacing">
      <option value="comfortable">Comfortable</option>
      <option value="compact">Compact</option>
    </select>
  </div>

  <script type="text/babel" src="components/Nav.jsx"></script>
  <script type="text/babel" src="components/Hero.jsx"></script>
  <script type="text/babel" src="components/Projects.jsx"></script>
  <script type="text/babel" src="components/Experience.jsx"></script>
  <script type="text/babel" src="components/Sections.jsx"></script>

  <script type="text/babel">
    const { useEffect } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "accentColor": "#10b981",
      "fontScale": 107,
      "cursor": "glow",
      "spacing": "comfortable"
    }/*EDITMODE-END*/;

    function App() {
      useEffect(() => {
        // Load tweaks from localStorage
        const saved = JSON.parse(localStorage.getItem('jsj-tweaks') || '{}');
        const t = { ...TWEAK_DEFAULTS, ...saved };
        applyTweaks(t);

        // Cursor
        const glow = document.getElementById('cursor-glow');
        const dot = document.getElementById('cursor-dot');
        const ring = document.getElementById('cursor-ring');
        let mx = -999, my = -999, rx = -999, ry = -999;
        let raf;

        const onMove = (e) => { mx = e.clientX; my = e.clientY; };
        window.addEventListener('mousemove', onMove);

        const animate = () => {
          rx += (mx - rx) * 0.14;
          ry += (my - ry) * 0.14;
          dot.style.left = mx + 'px';
          dot.style.top = my + 'px';
          glow.style.left = mx + 'px';
          glow.style.top = my + 'px';
          ring.style.left = rx + 'px';
          ring.style.top = ry + 'px';
          raf = requestAnimationFrame(animate);
        };
        animate();

        // Hover on links — expand ring
        const addHover = () => {
          document.querySelectorAll('a, button').forEach(el => {
            el.addEventListener('mouseenter', () => {
              ring.style.width = '56px';
              ring.style.height = '56px';
              ring.style.borderColor = 'rgba(16,185,129,0.7)';
              dot.style.transform = 'translate(-50%,-50%) scale(0.5)';
            });
            el.addEventListener('mouseleave', () => {
              ring.style.width = '32px';
              ring.style.height = '32px';
              ring.style.borderColor = 'rgba(16,185,129,0.4)';
              dot.style.transform = 'translate(-50%,-50%) scale(1)';
            });
          });
        };
        setTimeout(addHover, 800);

        // Scroll reveals
        const obs = new IntersectionObserver((entries) => {
          entries.forEach(en => {
            if (en.isIntersecting) {
              en.target.classList.add('visible');
            }
          });
        }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });

        const observe = () => {
          document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
        };
        observe();
        setTimeout(observe, 600);

        // Active nav highlight on scroll
        const sections = ['hero', 'about', 'projects', 'experience', 'skills', 'contact'];
        const navLinks = document.querySelectorAll('nav a[href^="#"]');
        const scrollSpy = () => {
          let current = '';
          sections.forEach(id => {
            const el = document.getElementById(id);
            if (el && window.scrollY >= el.offsetTop - 200) current = id;
          });
          navLinks.forEach(a => {
            const matches = a.getAttribute('href') === '#' + current;
            a.style.color = matches ? 'var(--accent)' : '';
          });
        };
        window.addEventListener('scroll', scrollSpy, { passive: true });

        return () => {
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('scroll', scrollSpy);
          cancelAnimationFrame(raf);
          obs.disconnect();
        };
      }, []);

      return (
        <>
          <Nav />
          <main>
            <Hero />
            <About />
            <Projects />
            <Experience />
            <Skills />
            <Contact />
          </main>
          <Footer />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);

    // ── TWEAKS ──────────────────────────────────────────
    function applyTweaks(t) {
      document.documentElement.style.setProperty('--accent', t.accentColor);
      document.documentElement.style.fontSize = (t.fontScale / 100) + 'rem';
      const glow = document.getElementById('cursor-glow');
      const dot = document.getElementById('cursor-dot');
      const ring = document.getElementById('cursor-ring');
      if (t.cursor === 'glow') {
        glow.style.opacity = '1'; dot.style.opacity = '1'; ring.style.opacity = '1';
      } else if (t.cursor === 'dot') {
        glow.style.opacity = '0'; dot.style.opacity = '1'; ring.style.opacity = '1';
      } else {
        glow.style.opacity = '0'; dot.style.opacity = '0'; ring.style.opacity = '0';
        document.body.style.cursor = 'auto';
      }
      document.querySelectorAll('section').forEach(s => {
        s.style.paddingTop = t.spacing === 'compact' ? '72px' : '';
        s.style.paddingBottom = t.spacing === 'compact' ? '72px' : '';
      });
    }

    // Tweaks panel wiring
    const panel = document.getElementById('tweaks-panel');
    const twAccent = document.getElementById('tw-accent');
    const twScale = document.getElementById('tw-scale');
    const twCursor = document.getElementById('tw-cursor');
    const twSpacing = document.getElementById('tw-spacing');

    const savedT = JSON.parse(localStorage.getItem('jsj-tweaks') || '{}');
    const curT = { ...TWEAK_DEFAULTS, ...savedT };
    twAccent.value = curT.accentColor;
    twScale.value = curT.fontScale;
    twCursor.value = curT.cursor;
    twSpacing.value = curT.spacing;

    function saveTweaks() {
      const t = {
        accentColor: twAccent.value,
        fontScale: parseInt(twScale.value),
        cursor: twCursor.value,
        spacing: twSpacing.value,
      };
      localStorage.setItem('jsj-tweaks', JSON.stringify(t));
      applyTweaks(t);
      window.parent.postMessage({ type: '__edit_mode_set_keys', edits: {
        accentColor: t.accentColor, fontScale: t.fontScale, cursor: t.cursor, spacing: t.spacing
      }}, '*');
    }

    [twAccent, twScale, twCursor, twSpacing].forEach(el => el.addEventListener('input', saveTweaks));

    window.addEventListener('message', (e) => {
      if (e.data?.type === '__activate_edit_mode') panel.classList.add('active');
      if (e.data?.type === '__deactivate_edit_mode') panel.classList.remove('active');
    });
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
  </script>
</body>
</html>
